worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  # In-cluster portal-api Service (HTTPS with serving cert).
  # Overridden via PORTAL_API_UPSTREAM env through a small entrypoint if needed.
  upstream portal_api {
    server desktop-portal-portal-api:8443;
  }
  server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    location /api/ {
      proxy_pass https://portal_api/;
      proxy_ssl_verify off;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Access-Token $http_x_forwarded_access_token;
      proxy_set_header X-Forwarded-User $http_x_forwarded_user;
    }
    location / {
      try_files $uri /index.html;
    }
  }
}
