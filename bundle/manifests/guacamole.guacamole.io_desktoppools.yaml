apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  creationTimestamp: null
  name: desktoppools.guacamole.guacamole.io
spec:
  group: guacamole.guacamole.io
  names:
    kind: DesktopPool
    listKind: DesktopPoolList
    plural: desktoppools
    singular: desktoppool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.desired
      name: Desired
      type: integer
    - jsonPath: .status.available
      name: Available
      type: integer
    - jsonPath: .status.stopped
      name: Stopped
      type: integer
    - jsonPath: .status.allocated
      name: Allocated
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DesktopPool manages a pool of Windows desktop VMs cloned from a golden DataSource
          and exposed to Guacamole over RDP.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DesktopPoolSpec defines the desired state of a desktop VM pool.
              MVP uses declarative replicas; minReady/bufferSize/maxSize are reserved for autoscaling.
            properties:
              bufferSize:
                description: |-
                  BufferSize is an extra warm-buffer beyond allocated/pending sessions.
                  Reserved for post-MVP autoscaling.
                format: int32
                minimum: 0
                type: integer
              createConnections:
                default: true
                description: |-
                  CreateConnections controls the provisional MVP strategy of creating a
                  GuacamoleConnection for every Available desktop.
                  Set to false when DesktopSession owns connection creation.
                type: boolean
              guacamole:
                description: Guacamole links the pool to a Guacamole instance and
                  RDP credentials.
                properties:
                  credentialsSecretName:
                    description: |-
                      CredentialsSecretName is the name of the Secret managed from password.
                      Defaults to "<desktoppool-name>-rdp-credentials".
                    type: string
                  ignoreCert:
                    default: true
                    description: IgnoreCert accepts self-signed RDP certificates (typical
                      for golden images).
                    type: boolean
                  instanceRef:
                    description: InstanceRef is the Guacamole stack that will host
                      connections.
                    properties:
                      name:
                        description: Name of the Guacamole resource.
                        type: string
                      namespace:
                        description: |-
                          Namespace of the Guacamole resource.
                          Defaults to the GuacamoleConnection namespace when unset.
                        type: string
                    required:
                    - name
                    type: object
                  parentGroup:
                    description: ParentGroup places generated GuacamoleConnections
                      inside a connection group.
                    type: string
                  password:
                    description: |-
                      Password is the Windows RDP password.
                      When set, the operator creates/updates a Secret in the DesktopPool namespace
                      (see credentialsSecretName) and wires GuacamoleConnections to it.
                      Prefer passwordSecretRef in production; plaintext is convenient for labs.
                      Ignored when passwordSecretRef is set.
                    type: string
                  passwordSecretRef:
                    description: |-
                      PasswordSecretRef references an existing Secret with the RDP password.
                      When set, the operator does not create a credentials Secret.
                    properties:
                      key:
                        default: password
                        description: Key within the secret.
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                    type: object
                  security:
                    default: nla
                    description: Security mode for RDP sessions.
                    enum:
                    - any
                    - nla
                    - nla-ext
                    - tls
                    - vmconnect
                    - rdp
                    type: string
                  username:
                    default: Administrator
                    description: |-
                      Username used for RDP authentication on pooled desktops.
                      Stored in the managed credentials Secret when password is set.
                    type: string
                required:
                - instanceRef
                type: object
              maxSize:
                description: MaxSize caps the total number of desktops when autoscaling
                  is enabled.
                format: int32
                minimum: 1
                type: integer
              minReady:
                description: |-
                  MinReady is the minimum number of Available desktops to keep warm.
                  Reserved for post-MVP autoscaling; ignored when replicas is set.
                format: int32
                minimum: 0
                type: integer
              network:
                description: Network configures desktop network exposure (RDP Service).
                properties:
                  rdpPort:
                    default: 3389
                    description: RDPPort is the Service / guest RDP port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              powerManagement:
                description: PowerManagement controls idle stop / wake-on-demand for
                  pooled desktops.
                properties:
                  enabled:
                    default: true
                    description: Enabled turns idle stop and wake-on-demand on.
                    type: boolean
                  idleSeconds:
                    default: 900
                    description: |-
                      IdleSeconds is how long an Available desktop may sit unused before it is
                      stopped (KubeVirt runStrategy Halted). Default is 900 (15 minutes).
                      Zero stops Available desktops on the next reconcile (still respecting minReady).
                    format: int64
                    minimum: 0
                    type: integer
                type: object
              recyclePolicy:
                default: Delete
                description: |-
                  RecyclePolicy controls what happens when a desktop is released.
                  Delete destroys the VM so the pool provisions a fresh clone.
                enum:
                - Delete
                - Retain
                type: string
              replicas:
                default: 1
                description: Replicas is the desired number of desktop VMs in the
                  pool.
                format: int32
                minimum: 0
                type: integer
              sessionLifecycle:
                description: |-
                  SessionLifecycle sets default idle / max-session policies for DesktopSessions
                  created against this pool (sessions may override per-object).
                properties:
                  idleSecondsAfterDisconnect:
                    default: 900
                    description: |-
                      IdleSecondsAfterDisconnect releases a DesktopSession after this many seconds
                      without an active Guacamole tunnel (never connected or after disconnect).
                      Zero disables idle logoff. Default is 900 (15 minutes) when the object is present
                      and this field is unset.
                    format: int64
                    minimum: 0
                    type: integer
                  maxSecondsAfterReady:
                    default: 0
                    description: |-
                      MaxSecondsAfterReady is the default max session lifetime applied to new
                      DesktopSessions when their ttlSecondsAfterReady is unset. Zero disables.
                    format: int64
                    minimum: 0
                    type: integer
                type: object
              source:
                description: Source selects the golden image used to clone desktop
                  disks.
                properties:
                  dataSource:
                    description: DataSource is a CDI DataSource (typically published
                      by the golden-image pipeline).
                    properties:
                      name:
                        description: Name of the DataSource.
                        type: string
                      namespace:
                        description: |-
                          Namespace of the DataSource.
                          Defaults to the DesktopPool namespace when unset.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - dataSource
                type: object
              virtualMachine:
                description: VirtualMachine configures CPU, memory and disk for each
                  desktop VM.
                properties:
                  cpu:
                    default: 2
                    description: CPU is the number of vCPU cores when InstanceType
                      is unset.
                    format: int32
                    minimum: 1
                    type: integer
                  diskSize:
                    default: 40Gi
                    description: DiskSize is the requested size of the root disk.
                    type: string
                  instanceType:
                    description: |-
                      InstanceType optionally references a VirtualMachineClusterInstancetype
                      (for example u1.large). When set, cpu/memory are omitted from the VM domain.
                    type: string
                  memory:
                    default: 4Gi
                    description: Memory is the memory request when InstanceType is
                      unset.
                    type: string
                  storageClassName:
                    description: StorageClassName used for the cloned root disk DataVolume.
                    type: string
                required:
                - storageClassName
                type: object
            required:
            - guacamole
            - source
            - virtualMachine
            type: object
          status:
            description: DesktopPoolStatus defines the observed state of DesktopPool.
            properties:
              allocated:
                description: Allocated is the number of desktops reserved by a session.
                format: int32
                type: integer
              available:
                description: Available is the number of desktops ready to be allocated.
                format: int32
                type: integer
              conditions:
                description: |-
                  Conditions represent the latest available observations of the pool state.
                  Includes Ready and CloneAuthorized.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              credentialsSecret:
                description: |-
                  CredentialsSecret is the Secret used for Windows RDP passwords on GuacamoleConnections.
                  Either the managed secret created from spec.guacamole.password, or the referenced passwordSecretRef.
                type: string
              dataSourceNamespace:
                description: |-
                  DataSourceNamespace is the golden-image namespace where CDI clone RBAC is provisioned.
                  Resolved from spec.source.dataSource.namespace (defaults to the pool namespace).
                type: string
              desired:
                description: Desired is the target number of desktops.
                format: int32
                type: integer
              desktops:
                description: Desktops lists members currently managed by the pool.
                items:
                  description: DesktopMemberStatus reports one desktop belonging to
                    the pool.
                  properties:
                    connectionName:
                      description: ConnectionName is the GuacamoleConnection created
                        for this desktop (MVP).
                      type: string
                    message:
                      description: Message holds a human-readable detail for Failed
                        states.
                      type: string
                    name:
                      description: Name of the VirtualMachine.
                      type: string
                    serviceDNS:
                      description: ServiceDNS is the cluster DNS name for the RDP
                        Service.
                      type: string
                    state:
                      description: State is the desktop lifecycle state.
                      type: string
                  required:
                  - name
                  - state
                  type: object
                type: array
              failed:
                description: Failed is the number of desktops in Failed state.
                format: int32
                type: integer
              phase:
                description: Phase is the current lifecycle phase of the pool.
                type: string
              provisioning:
                description: Provisioning is the number of desktops still provisioning
                  or booting.
                format: int32
                type: integer
              stopped:
                description: Stopped is the number of desktops powered off by power
                  management.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
