---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: desktopsessions.guacamole.guacamole.io
spec:
  group: guacamole.guacamole.io
  names:
    kind: DesktopSession
    listKind: DesktopSessionList
    plural: desktopsessions
    singular: desktopsession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolRef.name
      name: Pool
      type: string
    - jsonPath: .spec.requester.subject
      name: Subject
      type: string
    - jsonPath: .status.desktopName
      name: Desktop
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.queuePosition
      name: Queue
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DesktopSession represents a request for an exclusive desktop from a DesktopPool.
          The controller reserves an Available VM, creates a GuacamoleConnection, and on
          release/delete returns capacity to the pool (recyclePolicy=Delete destroys the VM).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DesktopSessionSpec requests an exclusive desktop from a DesktopPool.
            properties:
              maxQueueSeconds:
                description: |-
                  MaxQueueSeconds fails the session if it waits in the broker queue longer
                  than this duration. Zero/unset means wait indefinitely.
                format: int64
                minimum: 0
                type: integer
              poolRef:
                description: PoolRef references the DesktopPool that should allocate
                  a desktop.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                required:
                - name
                type: object
              priority:
                default: 0
                description: |-
                  Priority controls broker queue order when the pool has no Available desktop.
                  Higher values are served first; equal priorities use FIFO (creationTimestamp).
                format: int32
                type: integer
              requester:
                description: Requester identifies who requested the desktop.
                properties:
                  subject:
                    description: Subject is a free-form identity (username, email,
                      SSO subject, etc.).
                    type: string
                required:
                - subject
                type: object
              ttlSecondsAfterReady:
                description: |-
                  TTLSecondsAfterReady optionally bounds how long a Ready session may live
                  before the controller releases it. Zero/unset means no automatic expiry.
                format: int64
                minimum: 0
                type: integer
            required:
            - poolRef
            - requester
            type: object
          status:
            description: DesktopSessionStatus defines the observed state of DesktopSession.
            properties:
              conditions:
                description: Conditions represent the latest observations of the session
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connectionName:
                description: ConnectionName is the GuacamoleConnection created for
                  this session.
                type: string
              desktopName:
                description: DesktopName is the VirtualMachine reserved for this session.
                type: string
              message:
                description: Message holds a human-readable detail for Failed/Pending/Queued
                  states.
                type: string
              phase:
                description: Phase is the current lifecycle phase.
                type: string
              queueLength:
                description: QueueLength is how many sessions are waiting for the
                  same pool.
                format: int32
                type: integer
              queuePosition:
                description: |-
                  QueuePosition is this session's 1-based place in the pool broker queue.
                  Only set while Phase=Queued.
                format: int32
                type: integer
              queuedAt:
                description: QueuedAt is when the session entered the broker queue.
                format: date-time
                type: string
              readyAt:
                description: ReadyAt is when the session became Ready (used for TTL
                  expiry).
                format: date-time
                type: string
              serviceDNS:
                description: ServiceDNS is the RDP Service DNS for the allocated desktop.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
