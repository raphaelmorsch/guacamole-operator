---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: desktopportals.guacamole.guacamole.io
spec:
  group: guacamole.guacamole.io
  names:
    kind: DesktopPortal
    listKind: DesktopPortalList
    plural: desktopportals
    shortNames:
    - dportal
    singular: desktopportal
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.pluginName
      name: Plugin
      type: string
    - jsonPath: .status.userPortalURL
      name: UserPortal
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DesktopPortal deploys an OpenShift Console dynamic plugin for
          DesktopSession allocation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DesktopPortalSpec deploys an OpenShift Console dynamic plugin for allocating
              DesktopSessions to users sourced from an identity provider (e.g. Keycloak).
            properties:
              adminGroups:
                description: |-
                  AdminGroups grants portal admin APIs (batch allocate, pool config) to these OpenShift groups.
                  Users who can create DesktopSessions in the session namespace are also treated as admins.
                items:
                  type: string
                type: array
              apiImage:
                description: |-
                  APIImage is the container image for the portal API (Keycloak + DesktopSession).
                  Defaults to the RELATED_IMAGE_DESKTOP_PORTAL_API env on the operator.
                type: string
              defaultPool:
                description: DefaultPool is the DesktopPool used when creating sessions
                  from the UI.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      Defaults to the DesktopPortal namespace when unset.
                    type: string
                required:
                - name
                type: object
              displayName:
                default: Desktop Sessions
                description: DisplayName is shown in the OpenShift Console navigation.
                type: string
              enablePlugin:
                default: true
                description: EnablePlugin, when true, adds this plugin to consoles.operator.openshift.io/cluster.
                type: boolean
              keycloak:
                description: Keycloak configures the identity provider used to list
                  users.
                properties:
                  clientID:
                    description: ClientID is a confidential client with service-account
                      rights to query users.
                    type: string
                  clientSecretRef:
                    description: ClientSecretRef points to the client secret used
                      for client_credentials.
                    properties:
                      key:
                        default: password
                        description: Key within the secret.
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                    type: object
                  insecureSkipVerify:
                    description: InsecureSkipVerify disables TLS certificate verification
                      against Keycloak.
                    type: boolean
                  realm:
                    description: Realm is the Keycloak realm that holds end users.
                    type: string
                  url:
                    description: URL is the Keycloak base URL (e.g. https://keycloak.apps.example.com).
                    type: string
                required:
                - clientID
                - clientSecretRef
                - realm
                - url
                type: object
              navSection:
                default: home
                description: NavSection is the Console nav section id (e.g. home,
                  workloads).
                type: string
              pluginImage:
                description: |-
                  PluginImage is the container image that serves the Console dynamic plugin assets.
                  Defaults to the RELATED_IMAGE_DESKTOP_PORTAL_PLUGIN env on the operator.
                type: string
              replicas:
                default: 1
                description: Replicas for plugin and API deployments.
                format: int32
                minimum: 1
                type: integer
              sessionNamespace:
                description: |-
                  SessionNamespace is where DesktopSession objects are created.
                  Defaults to defaultPool.namespace, then to this resource's namespace.
                type: string
              userPortal:
                description: |-
                  UserPortal exposes a self-service PatternFly UI outside the Console via Route.
                  End users authenticate with Keycloak (same realm as the user directory / Guacamole OpenID).
                  Omit to keep Console-admin-only (backward compatible).
                properties:
                  enabled:
                    default: true
                    description: Enabled deploys the user portal Route when true.
                    type: boolean
                  hostname:
                    description: Hostname is an optional Route host.
                    type: string
                  image:
                    description: |-
                      Image is the user-portal container image (nginx + PatternFly SPA).
                      Defaults to RELATED_IMAGE_DESKTOP_USER_PORTAL on the operator.
                    type: string
                  issuer:
                    description: |-
                      Issuer is the public Keycloak OIDC issuer URL used by the browser login
                      (e.g. https://keycloak.apps.example.com/realms/guacamole).
                      Required when userPortal is enabled. Must match the iss claim of access tokens.
                      Prefer the public Route issuer (same as Guacamole OpenID), not the in-cluster Service URL.
                    type: string
                  oidcClientID:
                    default: guacamole-user-portal
                    description: |-
                      OIDCClientID is a Keycloak public client (standard flow + PKCE) for the user portal.
                      Do not reuse the confidential admin directory client or the Guacamole client.
                    type: string
                required:
                - issuer
                type: object
            required:
            - defaultPool
            - keycloak
            type: object
          status:
            description: DesktopPortalStatus defines the observed state of DesktopPortal.
            properties:
              apiService:
                description: APIService is the Service backing the portal API proxy.
                type: string
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consolePath:
                description: ConsolePath is the in-console route path.
                type: string
              phase:
                description: Phase is the current lifecycle phase.
                type: string
              pluginName:
                description: PluginName is the ConsolePlugin resource name.
                type: string
              pluginService:
                description: PluginService is the Service hosting plugin assets.
                type: string
              userPortalURL:
                description: UserPortalURL is the external self-service portal URL
                  when userPortal is enabled.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
