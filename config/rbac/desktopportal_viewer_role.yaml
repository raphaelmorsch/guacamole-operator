# permissions for end users to view desktopportals.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: desktopportal-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: guacamole-operator
    app.kubernetes.io/part-of: guacamole-operator
    app.kubernetes.io/managed-by: kustomize
  name: desktopportal-viewer-role
rules:
- apiGroups:
  - guacamole.guacamole.io
  resources:
  - desktopportals
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - guacamole.guacamole.io
  resources:
  - desktopportals/status
  verbs:
  - get
