apiVersion: guacamole.guacamole.io/v1alpha1
kind: DesktopPool
metadata:
  name: windows-desktop
  namespace: guacamole-desktops
spec:
  replicas: 2
  source:
    dataSource:
      name: win2k19-guacamole-desktop
      namespace: win2k19-golden
  virtualMachine:
    storageClassName: ocs-external-storagecluster-ceph-rbd-immediate
    diskSize: 60Gi
    cpu: 2
    memory: 4Gi
  network:
    rdpPort: 3389
  guacamole:
    instanceRef:
      name: guacamole
      namespace: guacamole
    username: Administrator
    # Must match windows-install-credentials in the golden-image namespace.
    password: "ChangeMe!"
    # Golden image disables NLA; "any"/"rdp" avoids Guacamole auth failures.
    security: any
    ignoreCert: true
  recyclePolicy: Delete
  # false = GuacamoleConnection only when a DesktopSession allocates a VM
  createConnections: false
  # Idle-stop Available desktops; wake when DesktopSessions are waiting.
  powerManagement:
    enabled: true
    idleSeconds: 900 # 15 minutes
  # Keep this many warm Available desktops even when idle (default 0).
  # minReady: 0
