apiVersion: guacamole.guacamole.io/v1alpha1
kind: Guacamole
metadata:
  name: guacamole
  namespace: guacamole
spec:
  guacamoleImage: guacamole/guacamole:1.6.0
  guacdImage: guacamole/guacd:1.6.0
  mysqlImage: mysql:8.0
  replicas: 1
  guacdReplicas: 1
  logLevel: info
  database:
    user: guacamole_user
    password: guacamole_pass
    rootPassword: rootpass123
    name: guacamole_db
    storageSize: 5Gi
  route:
    enabled: true
    tlsTermination: edge
    path: /guacamole
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetMemoryUtilizationPercentage: 80
  guacdAutoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetMemoryUtilizationPercentage: 80
  metricsExporter:
    port: 9110
    scrapeIntervalSeconds: 15
  # Optional: Keycloak / OIDC SSO for the Guacamole web UI (omit openID for MySQL users)
  # openID:
  #   enabled: true
  #   issuer: https://keycloak.apps.example.com/realms/guacamole
  #   clientID: guacamole
  #   redirectURI: https://guacamole.apps.example.com/guacamole
  #   usernameClaimType: preferred_username
  # Optional — customize login page title and logo (PNG recommended)
  # loginBranding:
  #   enabled: true
  #   title: "Corp Desktop Portal"
  #   logoSource: secret
  #   logoSecretRef:
  #     name: guacamole-login-logo
  #     key: logo
  #   extensionPriority: "*,openid"
